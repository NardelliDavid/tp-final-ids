<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Cine Paradiso</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/login_usuario.css') }}">
</head>

<body>

    <div class="contenedor">

        <h1>Cine Paradiso</h1>
        <h2>Crear cuenta nueva</h2>

        <form method="POST" action="{{ url_for('auth.registro') }}">

            <label for="nombre">Nombre completo:</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ingresá tu nombre completo"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="tu@email.com"
                required
            >

            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresá una contraseña"
                required
            >

            <button type="submit">Registrarse</button>

        </form>

        {% if mensaje %}
            <div class="mensaje">
                {{ mensaje }}
            </div>
        {% endif %}

        {% if exito %}
            <div class="resultado">
                {{ exito }}
            </div>
        {% endif %}

        <a class="logout" href="{{ url_for('auth.login') }}">
            ¿Ya tenés cuenta? Iniciá sesión acá
        </a>

    </div>

</body>
</html>
