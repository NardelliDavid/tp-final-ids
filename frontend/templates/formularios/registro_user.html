<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Carga la misma hoja de estilos para que el formulario se vea idéntico al login -->
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/formularios_login.css') }}">
    <title>Crear cuenta - Cine</title>
</head>

<body>

    <div class="contenedor">

        <h1>Bienvenido al Cine</h1>
        <h2>Crear cuenta nueva</h2>

        <!-- Envía nombre, email y password por POST a la función registro() de auth.py -->
        <form method="POST" action="{{ url_for('auth.registro') }}">

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit">Registrarse</button>

        </form>

        <!-- Caja roja que aparece si ocurre algún problema (ej: el email ya estaba registrado) -->
        {% if mensaje %}
            <div class="mensaje">
                {{ mensaje }}
            </div>
        {% endif %}

        <!-- Caja verde que aparece cuando la cuenta se crea correctamente en la base de datos -->
        {% if exito %}
            <div class="resultado">
                {{ exito }}
            </div>
        {% endif %}

        <!-- Enlace para volver al formulario de inicio de sesión -->
        <a class="logout" href="{{ url_for('auth.login') }}">
            ¿Ya tenés cuenta? Iniciá sesión acá
        </a>

    </div>

</body>
</html>
