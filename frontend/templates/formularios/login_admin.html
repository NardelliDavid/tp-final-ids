<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso administrativo | Cine Paradiso</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/login_usuario.css') }}">
</head>

<body>

    <div class="contenedor">

        {% if not session.get("token") %}

            <h1>Cine Paradiso</h1>
            <h2>Panel administrativo</h2>

            <form method="POST" action="{{ url_for('auth.login_admin') }}">

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Ingresá tu email"
                    required
                >

                <label for="password">Contraseña:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresá tu contraseña"
                    required
                >

                <button type="submit">Ingresar</button>

            </form>

            {% if mensaje %}
                <div class="mensaje">
                    {{ mensaje }}
                </div>
            {% endif %}

        {% endif %}

    </div>

</body>
</html>
