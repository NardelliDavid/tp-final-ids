<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de entradas</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/login.css') }}">
</head>

<body>

    <div class="contenedor">
        
            <h1>Administración de entradas</h1>
            <h2>Validación de QR</h2>

            <form method="POST" action="{{ url_for('qr.admin_qr') }}">

                <label>Número de función:</label>
                <input type="number" name="funcion_id" min="1" required>

                <label>Token del QR:</label>
                <input type="text" name="qr_token" required>
                
                <button type="submit">Validar entrada</button>

            </form>

            {% if resultado %}
                <div class="resultado">
                    <strong>Respuesta:</strong>
                    <pre>{{ resultado | tojson(indent=2) }}</pre>
                </div>
            {% endif %}

            {% if error %}
                <div class="mensaje">
                    {{ error }}
                </div>
            {% endif %}

            <a class="logout" href="{{ url_for('auth.logout') }}">
                Cerrar sesión
            </a>

    </div>

</body>
</html>
